              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PodLoadTestSpec defines the desired state of PodLoadTest
            properties:
              cleanup:
                description: Cleanup controls how completed Pods are reclaimed.
                properties:
                  deleteCompletedPods:
                    default: true
                    description: |-
                      DeleteCompletedPods deletes Pods as soon as they reach Succeeded or
                      Failed. Defaults to true.
                    type: boolean
                  deletePVCs:
                    default: true
                    description: |-
                      DeletePVCs deletes the PVC created for a Pod when that Pod is reclaimed.
                      Defaults to true.
                    type: boolean
                  ttlSecondsAfterFinished:
                    default: 0
                    description: |-
                      TTLSecondsAfterFinished delays Pod deletion by this many seconds after
                      completion. Defaults to 0 (delete immediately).
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              createConcurrency:
                default: 10
                description: |-
                  CreateConcurrency is the number of Pod create requests that may run in
                  parallel. Increase it when the API server can handle more concurrency.
                format: int32
                maximum: 500
                minimum: 1
                type: integer
              durationSeconds:
                description: |-
                  DurationSeconds stops submission after this many seconds. Zero means no
                  time limit.
                format: int64
                minimum: 0
                type: integer
              maxInFlight:
                default: 100
                description: |-
                  MaxInFlight is the maximum number of submitted Pods that have not
                  completed yet. Once reached, submission pauses until Pods complete and
                  are reclaimed.
                format: int32
                minimum: 1
                type: integer
              podTimeoutSeconds:
                description: |-
                  PodTimeoutSeconds deletes Pods that have not completed within this many
                  seconds. Zero disables the timeout. This prevents a broken image or an
                  unschedulable Pod from stalling the run.
                format: int32
                minimum: 0
                type: integer
              storage:
                description: Storage enables a dedicated PVC for every Pod when set.
                properties:
                  accessModes:
                    description: AccessModes for each PVC. Defaults to ReadWriteOnce.
                    items:
                      type: string
                    type: array
                  mountPath:
                    description: |-
                      MountPath is where the volume is mounted in every container.
                      Defaults to /data.
                    type: string
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Size is the requested storage size for each PVC.
                      Defaults to 1Gi.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
