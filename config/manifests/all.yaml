apiVersion: v1
kind: Service
metadata:
  labels:
    control-plane: controller-manager
  name: podset-operator-controller-manager-metrics-service
  namespace: podset-operator-system
spec:
  ports:
  - name: https
    port: 8443
    targetPort: https
  selector:
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    control-plane: controller-manager
  name: podset-operator-controller-manager
  namespace: podset-operator-system
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --metrics-addr=:8443
        - --metrics-secure=true
        - --enable-leader-election
        command:
        - /manager
        image: shaloudocker/podset:v1
        name: manager
        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 256Mi
      terminationGracePeriodSeconds: 10
